<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1 {
            background-color: brown;
            color: blue;
            padding: 20px;
            text-align: center;
        }

        table,
        th,
        td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 5px;
            text-align: center;
        }
    </style>

</head>

<body>
    <h1>Exercício 1</h1>

    <table>
        <tr>
            <td colspan="2">Coluna1</td>
            <td>Coluna2</td>
            <td>Coluna3</td>
        </tr>

        <tr>
            <td>Coluna1</td>
            <td colspan="3">Coluna2</td>
        </tr>

        <tr>
            <td rowspan="2">Coluna1</td>
            <td>Coluna2</td>
            <td>Coluna3</td>
            <td>Coluna4</td>
        </tr>

        <tr>
            <td>Coluna2</td>
            <td>Coluna3</td>
            <td>Coluna4</td>
        </tr>

        <tr>
            <td>Coluna1</td>
            <td rowspan="3">Coluna2</td>
            <td>Coluna3</td>
            <td>Coluna4</td>
        </tr>

        <tr>
            <td>Coluna1</td>
            <td colspan="3">Coluna3</td>
        </tr>

        <tr>
            <td>Coluna1</td>
            <td>Coluna3</td>
            <td>Coluna4</td>
        </tr>




    </table>
</body>

</html>
